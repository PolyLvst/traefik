version: '3.8'

services:
  traefik:
    image: traefik:v3.5
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    ports:
      - "80:80"
      - "443:443"
      - "8050:8050"
    command:
      # API and Dashboard
      - --api.dashboard=true
      - --api.insecure=false
      
      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.wagateway.address=:8050
      # Trust Cloudflare's X-Forwarded-* on 443. Sites here are proxied by
      # Cloudflare, so every request arrives from one of its edges; without
      # this, Traefik replaces Cloudflare's header with the edge's address and
      # apps never see the real client. Traefik appends the edge after it, so an
      # app that reads the header from the right still can't be spoofed.
      # Ranges from https://www.cloudflare.com/ips/ (checked 2026-10-01).
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      
      # Docker Provider
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy

      # File Provider — for backends that aren't sibling containers on this host
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true

      # Let's Encrypt (ACME)
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      
      # Logging
      - --log.level=INFO
      - --accesslog=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-data/letsencrypt:/letsencrypt
      - ./traefik-data/dynamic:/etc/traefik/dynamic:ro
    labels:
      # Enable Traefik for this service
      - traefik.enable=true
      
      # Dashboard
      - traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_DOMAIN}`)
      - traefik.http.routers.traefik-dashboard.entrypoints=websecure
      - traefik.http.routers.traefik-dashboard.tls=true
      - traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt
      - traefik.http.routers.traefik-dashboard.service=api@internal
      - traefik.http.routers.traefik-dashboard.middlewares=traefik-auth
      
      # Basic Auth Middleware
      - traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_AUTH}

networks:
  proxy:
    name: proxy
    external: true
