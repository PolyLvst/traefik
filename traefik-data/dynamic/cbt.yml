# ===============================================================
# cbt.nusitek.com → Bandung VPS (HTTPS termination here)
#
# Fronts the CBT manager/admin panel (/manager/*) with HTTPS. Voice
# grading and any future webcam/mic features need a secure context,
# which Bandung can't serve directly (:443 isn't reachable).
#
# Why file-provider (not docker labels): the CBT backend isn't a
# sibling container on this Singapore host — it runs on the Bandung
# VPS as a remote HTTP origin. Docker labels can't target that.
#
# Chain:
#   Browser ─HTTPS→ Cloudflare edge ─HTTPS→ Traefik (this server)
#           ─HTTP→ Bandung VPS :80 (CBT / nginx + php-fpm)
#
# Traefik v3 auto-sets X-Forwarded-Proto / -For / -Host on the
# upstream request. The CBT app's index.php shim reads
# X-Forwarded-Proto and sets $_SERVER['HTTPS'] = 'on' so CodeIgniter
# builds https:// URLs back to cbt.nusitek.com.
#
# IMPORTANT: lock down Bandung's :80 to only accept connections from
# this Singapore VPS's IP. Otherwise an attacker can hit Bandung
# directly and spoof X-Forwarded-Proto into the shim.
# ===============================================================

http:
  routers:
    cbt-manager:
      rule: "Host(`cbt.nusitek.com`)"
      entryPoints:
        - websecure
      service: cbt-bandung
      tls:
        certResolver: letsencrypt

  services:
    cbt-bandung:
      loadBalancer:
        # so CI on Bandung sees Host: cbt.nusitek.com, not the raw IP —
        # required for base_url() / site_url() to build the right URLs.
        passHostHeader: true
        servers:
          - url: "http://202.138.226.26:80"
