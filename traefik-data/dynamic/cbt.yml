http:
  routers:
    cbt-sg-in:
      rule: "Host(`cbt.nusitek.com`)"
      entryPoints:
        - websecure
      service: cbt-sg-in
      tls:
        certResolver: letsencrypt

  services:
    cbt-sg-in:
      loadBalancer:
        # Keep the original Host (cbt.nusitek.com) all the way to the backend so
        # the app's base_url()/links stay on cbt.nusitek.com. The TLS leg still
        # dials the VPS with SNI cbt.xobdg.nusitek.com (see serverName below), so
        # the VPS's real LE cert validates — SNI and Host are independent layers.
        # The VPS Traefik must therefore also route Host(`cbt.nusitek.com`).
        passHostHeader: true
        servers:
          - url: "https://cbt.xobdg.nusitek.com"
        serversTransport: cbt-migration-upstream

  serversTransports:
    cbt-migration-upstream:
      # SNI for the outbound TLS handshake — must match the VPS's cert
      # (cbt.xobdg.nusitek.com), independent of the forwarded Host header.
      serverName: "cbt.xobdg.nusitek.com"
